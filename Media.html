<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="N-Vizion Church Messages — Coming Soon" />
    <title>Messages — N-Vizion Church</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Raleway:wght@700;800;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: 'Raleway', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    /* Nav */
    .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,.94); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,168,76,.12); padding: .6rem 0; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .nav-links { display: flex; align-items: center; gap: 2.2rem; list-style: none; }
    .nav-links a { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.6); text-decoration: none; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-cta { color: #000 !important; background: #c9a84c; padding: .5rem 1.2rem; border-radius: 2px; }
    .nav-cta:hover { background: #e8c86a !important; }
    .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
    .nav-toggle span { display: block; width: 24px; height: 2px; background: #fff; }
    .mobile-menu { display: none; flex-direction: column; background: rgba(0,0,0,.97); padding: 1.5rem 1.5rem 2rem; border-top: 1px solid rgba(201,168,76,.15); }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { font-size: .78rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.7); text-decoration: none; padding: .85rem 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .mobile-menu .nav-cta { margin-top: 1.25rem; text-align: center; border-bottom: none; }
    .nav-logo-wrap a { display: flex; align-items: center; text-decoration: none; }
    .nav-logo { height: 44px; width: auto; object-fit: contain; display: block; }
    @media (max-width: 900px) { .nav-links { display: none; } .nav-toggle { display: flex; } }

    /* Main content */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8rem 2rem 6rem; text-align: center; }
    .eyebrow { font-size: .62rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: #c9a84c; margin-bottom: 1.5rem; }
    h1 { font-family: 'Oswald', sans-serif; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 700; text-transform: uppercase; color: #fff; line-height: 1; margin-bottom: 1.5rem; }
    .line { width: 40px; height: 2px; background: #c9a84c; margin: 0 auto 1.5rem; }
    .sub { font-family: 'Lora', serif; font-style: italic; font-size: 1rem; color: rgba(255,255,255,.35); line-height: 1.8; max-width: 380px; margin: 0 auto; }


    /* ──────────────────────────────────────────
       SCROLL REVEAL SYSTEM
       ───────────────────────────────────────── */
    .reveal {
        opacity: 0;
        transform: translateY(48px);
        transition: opacity 0.85s cubic-bezier(.16,1,.3,1), transform 0.85s cubic-bezier(.16,1,.3,1);
    }
    .reveal.delay-1 { transition-delay: 0.1s; }
    .reveal.delay-2 { transition-delay: 0.2s; }
    .reveal.delay-3 { transition-delay: 0.35s; }
    .reveal.delay-4 { transition-delay: 0.5s; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-left  { opacity: 0; transform: translateX(-48px); transition: opacity 0.85s cubic-bezier(.16,1,.3,1), transform 0.85s cubic-bezier(.16,1,.3,1); }
    .reveal-right { opacity: 0; transform: translateX(48px);  transition: opacity 0.85s cubic-bezier(.16,1,.3,1), transform 0.85s cubic-bezier(.16,1,.3,1); }
    .reveal-left.visible, .reveal-right.visible { opacity: 1; transform: translate(0); }

    /* Footer */
    footer { border-top: 1px solid rgba(201,168,76,.08); padding: 2rem; text-align: center; }
    footer p { font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.18); }
    </style>
</head>
<body>

<nav class="site-nav" id="siteNav">
    <div class="nav-inner">
        <div class="nav-logo-wrap">
            <a href="index.html">
                <img src="assets/img/logo-gold.png" alt="N-Vizion Church" class="nav-logo" />
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="Events.html">Events</a></li>
            <li><a href="Media.html" class="active">Messages</a></li>
            <li><a href="Prayer Request.html">Prayer</a></li>
            <li><a href="Give.html">Give</a></li>
            <li><a href="newcomers.html" class="nav-cta">I'm New</a></li>
        </ul>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="Events.html">Events</a>
        <a href="Media.html" class="active">Messages</a>
        <a href="Prayer Request.html">Prayer</a>
        <a href="Give.html">Give</a>
        <a href="newcomers.html" class="nav-cta">I'm New</a>
    </div>
</nav>

<main>
    <div>
        <p class="eyebrow reveal">Messages</p>
        <h1 class="reveal delay-1">Coming<br>Soon</h1>
        <div class="line reveal delay-2"></div>
        <p class="sub reveal delay-3">Our message archive is currently in the works. Check back soon.</p>
    </div>
</main>

<footer>
    <p>180 Churchill Drive &bull; Sparta, TN 38583 &bull; &copy; N-Vizion Church 2026</p>
</footer>



        <script id="shared-nav-js">
        (function(){
            var nav = document.getElementById('siteNav');
            window.addEventListener('scroll', function(){ nav.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });
            var toggle = document.getElementById('navToggle');
            var menu   = document.getElementById('mobileMenu');
            toggle.addEventListener('click', function(){ menu.classList.toggle('open'); });
            var observer = new IntersectionObserver(function(entries){
                entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); observer.unobserve(e.target); } });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(function(el){ observer.observe(el); });
        })();
        </script>
</body>
</html>
